name: Build TWINS SOFT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/android-sdk"

          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -fL \
            -o android-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip

          unzip -q android-tools.zip -d "$SDK_ROOT/cmdline-tools"

          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "Checking sdkmanager..."
          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract TWINS SOFT project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(
            find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(
              find extracted -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print -quit |
              xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle Android project not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build TWINS SOFT
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWINS-SOFT-APK
          path: ${{ env.APK }}
          if-no-files-found: error
